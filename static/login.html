<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Stock Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Stock Analytics</span>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 520px;">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">👤 Вход</h5>
            </div>
            <div class="card-body">
                <div id="login-alert" class="alert alert-light border">Введите логин и пароль.</div>

                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input id="login-username" class="form-control" autocomplete="username" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input id="login-password" type="password" class="form-control" autocomplete="current-password" />
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="doLogin()">Войти</button>
                    <a class="btn btn-outline-secondary" href="/static/index.html">На главную</a>
                </div>

                <hr class="my-4">

                <h6>Регистрация по приглашению</h6>
                <div class="mb-2">
                    <label class="form-label">Invite code</label>
                    <input id="reg-invite" class="form-control" />
                </div>
                <div class="mb-2">
                    <label class="form-label">Логин</label>
                    <input id="reg-username" class="form-control" autocomplete="username" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input id="reg-password" type="password" class="form-control" autocomplete="new-password" />
                </div>
                <button class="btn btn-outline-success" onclick="doRegister()">Зарегистрироваться</button>

                <small class="text-muted d-block mt-3">
                    Если вход/регистрация не работают — проверьте, что на сервере выставлено <code>AUTH_USERS_ENABLED=true</code>.
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/login.js?v=auth-1"></script>
</body>
</html>
