# Конфигурация системы мониторинга и уведомлений

# Telegram настройки
telegram:
  enabled: true
  # Токен и chat_id берутся из переменных окружения (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
  
# Настройки мониторинга
monitoring:
  update_interval_hours: 3  # Интервал обновления данных (3 или 4 часа)
  # Свечи: глубина истории и кэш
  candles_cache_enabled: true
  candles_cache_refresh_days: 7   # сколько дней "хвоста" докачивать при каждом запуске
  candles_period_minutes: 60      # период moexalgo для тикеров (60 = 1 час)
  candles_days_daily: 400         # глубина свечей для ежедневного анализа
  candles_days_frequent: 400      # глубина свечей для интервальной джобы (можно уменьшить, если нужно)
  price_change_threshold_pct: 3.0  # Минимальное изменение цены для уведомления (%)
  volume_spike_threshold: 2.0  # Порог всплеска объёма (во сколько раз больше среднего)
  use_adaptive_thresholds: true  # Использовать адаптивные пороги на основе волатильности
  filter_trading_hours: true  # Фильтровать изменения вне торговых часов (10:00-18:45 МСК)
  
  # Периоды для сравнения
  compare_periods:
    - hours: 3  # Сравнение с 3 часами назад
    - hours: 24  # Сравнение с 24 часами назад

# Настройки уведомлений
notifications:
  only_portfolio: true  # Только инструменты из портфеля
  min_priority: "LOW"  # Минимальный приоритет сигнала (HIGH, MEDIUM, LOW)
  group_notifications: true  # Группировать уведомления (одно сообщение с несколькими сигналами)
  
# История цен
price_history:
  days_to_keep: 30  # Сколько дней хранить историю (старые данные удаляются автоматически)
