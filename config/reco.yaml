# Конфигурация правил для системы рекомендаций BUY/HOLD/SELL
# (учёт отзыва: нормализация DY, разделение акции/облигации, BUY = редкость)

# === Дивиденды / купон (нормализация: DY > dy_score_cap не усиливает BUY) ===
dy_buy_min: 8.0           # Минимальная DY для покупки (%)
dy_very_high: 15.0        # Выше — не бонус, предупреждение «проверить устойчивость»
dy_score_cap: 12.0        # Для scoring: min(DY, dy_score_cap)

# === Позиция относительно SMA200 ===
max_discount_vs_sma200: -10.0   # Максимальный дисконт (%, отрицательное)
min_premium_vs_sma200: 10.0     # Минимальная премия для продажи (%, положительное)
# Для BUY при цене ниже SMA200 нужен сильный фундамент:
buy_score_if_below_sma200: 3.2  # Минимальный score для BUY при цене < SMA200

# === Тренд ===
trend_up_min: 0.5         # Минимальный положительный тренд за 20 дней (%)
trend_down_max: -0.5      # Максимальный отрицательный тренд (%)

# === Границы scoring (BUY — редкость, 2–4 идеи) ===
buy_score_cutoff: 2.8     # Порог score для BUY
sell_score_cutoff: -2.0   # Порог score для SELL
max_buy_count: 4          # Макс. число рекомендаций BUY в отчёте

# === 52W диапазон ===
near_52w_low_threshold: 0.3   # Нижняя треть диапазона (0-0.3)
near_52w_high_threshold: 0.9  # Верхняя граница (0.9-1.0)

# === Модуль предсказания событий ===
event_predictor:
  enabled: true                # Включить/выключить модуль
  weight:
    HIGH_PROBABILITY: 1.5      # Вес для HIGH_PROBABILITY сигнала
    MEDIUM_PROBABILITY: 0.5    # Вес для MEDIUM_PROBABILITY сигнала
    NEGATIVE_SIGNAL: -1.0      # Вес для NEGATIVE_SIGNAL
    LOW: 0.0                   # Вес для LOW (нейтральный)

